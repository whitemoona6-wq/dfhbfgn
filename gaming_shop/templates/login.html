{% extends "base.html" %}
{% block title %}Вход — GameGear{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="auth-card">
                <div class="text-center mb-4">
                    <i class="bi bi-controller fs-1 text-primary"></i>
                    <h2 class="mt-2">Вход</h2>
                    <p class="text-muted">Войдите в свой аккаунт GameGear</p>
                </div>
                
                <form method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Имя пользователя или Email</label>
                        <input type="text" name="username" class="form-control bg-dark text-white border-secondary" 
                               required autofocus placeholder="demo">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" 
                               required placeholder="demo123">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">
                        <i class="bi bi-box-arrow-in-right"></i> Войти
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted">Нет аккаунта? <a href="{{ url_for('auth.register') }}">Зарегистрироваться</a></p>
                </div>
                
                <div class="alert alert-info mt-3 small">
                    <strong>Демо-аккаунты:</strong><br>
                    Пользователь: <code>demo</code> / <code>demo123</code><br>
                    Админ: <code>admin</code> / <code>admin123</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
